[project]
name = "dot-zero-game"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.4.3",
    "pydantic==2.12.5",
]

[project.optional-dependencies]
dev = [
    "coverage==7.13.5",
    "isort==8.0.1",
    "pylint==4.0.5",
    "pytest==9.0.2",
    "pytest-cov==7.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]